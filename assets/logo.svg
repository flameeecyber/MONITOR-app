<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1319"/>
      <stop offset="100%" stop-color="#070B11"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FD9A4"/>
      <stop offset="100%" stop-color="#3BA87A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FA8E0"/>
      <stop offset="100%" stop-color="#4A7FBF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="60" fill="url(#bg)" stroke="#262F3C" stroke-width="2"/>

  <!-- Outer ring (scanning radar) -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="#262F3C" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#1A2A3A" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Shield shape -->
  <path d="M200 60 L300 100 L300 190 Q300 280 200 330 Q100 280 100 190 L100 100 Z"
        fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.3"/>

  <!-- Terminal bracket left -->
  <rect x="110" y="135" width="50" height="8" rx="4" fill="url(#glow)" opacity="0.6"/>
  <rect x="110" y="135" width="8" height="30" rx="3" fill="url(#accent)" opacity="0.4"/>

  <!-- M letter (cyberpunk style with cutout) -->
  <path d="M140 170 L140 260 L160 260 L160 210 L185 245 L200 260 L215 245 L240 210 L240 260 L260 260 L260 170 L240 190 L200 230 L160 190 Z"
        fill="url(#glow)"/>

  <!-- Terminal bracket right -->
  <rect x="240" y="135" width="50" height="8" rx="4" fill="url(#glow)" opacity="0.6"/>
  <rect x="282" y="135" width="8" height="30" rx="3" fill="url(#accent)" opacity="0.4"/>

  <!-- Cursor blink -->
  <rect x="285" y="148" width="6" height="14" rx="2" fill="#5FD9A4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom scan line -->
  <line x1="120" y1="290" x2="280" y2="290" stroke="url(#glow)" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="290" r="3" fill="#5FD9A4" opacity="0.5">
    <animate attributeName="cx" values="120;280;120" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Status dots -->
  <circle cx="155" cy="310" r="4" fill="#5FD9A4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="175" cy="310" r="4" fill="#5FD9A4" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="195" cy="310" r="4" fill="#5FD9A4" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
